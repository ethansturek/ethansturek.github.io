<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>ESImages</title>
</head>
<body>
    <header>
        <h3 class="logo">Ethan Sturek Images</h3>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <img class="banner" src="Pictures/Corey1.jpg" alt="Car" style="width:100%; height:auto;">

    <div class="mid-seperator">
        <h1 class="portfolio">
        Portfolio
        </h1>
        <hr style="width:45%">
    </div>

<div class="gallery-container">
        <div class="gallery">
            <div class="image-item">
                <img src="Pictures/Car1.jpg" alt="Car">
                <div class="overlay">Cars</div>
            </div>
            <div class="image-item">
                <img src="Pictures/Zane1.jpg" alt="Zane">
                <div class="overlay">Weddings</div>
            </div>
            <div class="image-item">
                <img src="Pictures/Event1.jpg" alt="Event">
                <div class="overlay">Events</div>
            </div>
            <div class="image-item">
                <img src="Pictures/Fishing1.jpg" alt="Fishing">
                <div class="overlay">Lifestyle</div>
            </div>
            <div class="image-item">
                <img src="Pictures/Portraits1.jpg" alt="Portrait">
                <div class="overlay">Portraits</div>
            </div>
            <div class="image-item">
                <img src="Pictures/Product1.jpg" alt="Product">
                <div class="overlay">Products</div>
            </div>
        </div>
</div>

        <footer>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </footer>
</body>
</html>
